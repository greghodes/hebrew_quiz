<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>FP&amp;A Hebrew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Light/dark tokens. One accent; red only for wrong answers. */
:root{
  --bg:#ffffff;--bg2:#f5f5f7;--bg3:#e8e8ed;--line:#d2d2d7;--line2:#ececf0;
  --tx:#1d1d1f;--tx2:#6e6e73;--tx3:#a1a1a6;
  --ac:#0071e3;--ac-soft:rgba(0,113,227,.08);
  --bad:#d70015;--bad-soft:rgba(215,0,21,.06);
  --knob:#ffffff;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --he:"Heebo","SF Hebrew",-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000;--bg2:#1c1c1e;--bg3:#2c2c2e;--line:#3a3a3c;--line2:#1f1f21;
  --tx:#f5f5f7;--tx2:#98989d;--tx3:#636366;
  --ac:#0a84ff;--ac-soft:rgba(10,132,255,.14);
  --bad:#ff453a;--bad-soft:rgba(255,69,58,.12);
  --knob:#f5f5f7;
  color-scheme:dark;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 32px)}
.he{font-family:var(--he);direction:rtl;unicode-bidi:isolate}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:48px;min-height:32px}
.brand{font-size:15px;font-weight:600;letter-spacing:-.01em}
.nav{display:flex;gap:22px}
.link{background:none;border:0;color:var(--ac);font-size:15px;cursor:pointer;padding:4px 0}
.link.quiet{color:var(--tx2)}

/* Home */
.date{font-size:15px;color:var(--tx2)}
.headline{font-size:40px;font-weight:600;letter-spacing:-.025em;line-height:1.1;margin:6px 0 8px}
.sub{color:var(--tx2);font-size:17px;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);margin:36px 0}
.stat{padding:16px 0}
.stat+.stat{padding-left:16px;border-left:1px solid var(--line2)}
.stat-v{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat-l{font-size:13px;color:var(--tx2);margin-top:2px}
.section{margin-top:52px}
.section-t{font-size:20px;font-weight:600;letter-spacing:-.015em;margin-bottom:6px}
.cat{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 0;border-bottom:1px solid var(--line2);font-size:15px}
.cat-n{color:var(--tx2);font-size:13px;font-variant-numeric:tabular-nums;align-self:center}
.bar{grid-column:1/-1;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--ac)}
.bar i.l{opacity:.3}
.foot{margin-top:28px;font-size:13px;color:var(--tx3)}

/* Buttons */
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 20px;font-size:17px;font-weight:500;cursor:pointer;text-align:center;transition:opacity .15s}
.btn-p{background:var(--ac);color:#fff}
.btn-s{background:var(--bg2);color:var(--tx)}
.btn+.btn{margin-top:10px}
.btn[disabled]{opacity:.35;cursor:default}
.row-btns{display:flex;gap:10px;margin-top:16px}
.row-btns .btn{margin-top:0}

/* Session */
.sess-top{display:flex;align-items:center;gap:16px;margin-bottom:56px}
.prog{flex:1;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac);transition:width .3s ease}
.count{font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.stage{flex:1;display:flex;flex-direction:column}
.ask{font-size:15px;color:var(--tx2);text-align:center}
.p-he{font-size:52px;font-weight:600;text-align:center;line-height:1.2;margin:14px 0 6px;letter-spacing:-.01em}
.p-en{font-size:32px;font-weight:600;text-align:center;line-height:1.2;letter-spacing:-.022em;margin:14px 0 6px}
.p-en.small{font-size:24px}
.p-gloss{font-size:22px;text-align:center;margin-top:22px;font-weight:500}
.tr{text-align:center;color:var(--tx2);font-size:16px;font-style:italic}
.note{text-align:center;color:var(--tx2);font-size:14px;margin-top:12px;line-height:1.5}
.play{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:0;background:var(--bg2);color:var(--ac);cursor:pointer;margin:18px auto 0}
.play.big{width:96px;height:96px;margin-top:8px}
.play.big svg{width:34px;height:34px}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:44px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 16px;font-size:17px;cursor:pointer;transition:border-color .15s,background .15s,opacity .15s}
.opt .k{font-size:12px;color:var(--tx3);width:10px;font-variant-numeric:tabular-nums}
.opt .t{flex:1;line-height:1.3}
.opt .t.he{font-size:22px;text-align:right}
@media (hover:hover){.opt:hover:not([disabled]){border-color:var(--tx3)}}
.opt.ok{border-color:var(--ac);background:var(--ac-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.4}
.opt[disabled]{cursor:default}

.ans{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:26px;text-align:right;background:var(--bg);color:var(--tx);outline:none;margin-top:44px;-webkit-appearance:none}
.ans:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--ac-soft)}
.ans.ok{border-color:var(--ac)}
.ans.bad{border-color:var(--bad)}
.kb{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.kb-row{display:flex;gap:5px;justify-content:center}
.kb button{flex:1;max-width:46px;height:44px;border:0;border-radius:8px;background:var(--bg2);font-family:var(--he);font-size:20px;cursor:pointer}
.kb button.wide{max-width:none;flex:2;font-family:var(--sans);font-size:14px;color:var(--tx2)}
.kb button:active{background:var(--bg3)}

.build{min-height:66px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:12px 0;margin-top:36px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;margin-top:22px;justify-content:center}
.tile{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 14px;font-family:var(--he);font-size:20px;cursor:pointer}
.tile.used{visibility:hidden}
.tile.ok{border-color:var(--ac);color:var(--ac)}
.tile.bad{border-color:var(--bad);color:var(--bad)}
.tile[disabled]{cursor:default}

/* Feedback sits at the bottom of the stage */
.fb{margin-top:auto;padding-top:28px}
.fb-card{border-top:1px solid var(--line2);padding-top:20px}
.fb-status{font-size:15px;font-weight:600;margin-bottom:10px}
.fb-status.ok{color:var(--ac)}
.fb-status.bad{color:var(--bad)}
.fb-line{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.fb-he{font-size:28px;font-weight:600;line-height:1.2;text-align:right}
.fb-en{font-size:17px;line-height:1.3}
.fb-tr{color:var(--tx2);font-size:14px;font-style:italic;margin-top:3px}
.fb-note{color:var(--tx2);font-size:14px;margin-top:10px;line-height:1.5}
.fb-sent{font-size:24px;font-weight:600;line-height:1.4;text-align:right}
.fb-bottom{display:flex;gap:10px;align-items:center;margin-top:20px}
.fb-bottom .btn{flex:1}
.fb-bottom .play{margin:0;flex-shrink:0;width:50px;height:50px}

/* Words */
.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:16px;background:var(--bg);color:var(--tx);outline:none;-webkit-appearance:none}
.field:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--ac-soft)}
select.field{margin-top:10px;background:var(--bg2);border-color:transparent}
.meta{font-size:13px;color:var(--tx2);margin:18px 0 4px}
.w{display:grid;grid-template-columns:10px 1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line2);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--tx3)}
.dot.l{border-color:var(--ac)}
.dot.k{border-color:var(--ac);background:var(--ac)}
.w-en{font-size:15px}
.w-tr{font-size:13px;color:var(--tx2);font-style:italic;margin-top:1px}
.w-he{font-size:20px;font-weight:500;text-align:right}
.legend{display:flex;gap:18px;font-size:13px;color:var(--tx2);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}

/* Settings */
.set{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line2);font-size:15px}
.set-d{font-size:13px;color:var(--tx2);margin-top:2px}
.seg{display:flex;background:var(--bg2);border-radius:9px;padding:2px;flex-shrink:0}
.seg button{border:0;background:none;font-size:13px;padding:6px 11px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){.seg button.on{background:var(--bg3)}}
.set select{font-size:15px;color:var(--tx);background:var(--bg2);border:0;border-radius:8px;padding:7px 10px;max-width:55%}
.sw{position:relative;width:51px;height:31px;flex-shrink:0}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--bg3);border-radius:16px;cursor:pointer;transition:background .2s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--knob);box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked+span{background:var(--ac)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:2px solid var(--ac);outline-offset:2px}
.danger{color:var(--bad)}
</style>
</head>

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pick = a => a[Math.floor(Math.random()*a.length)];

// Hebrew answer matching: ignore niqqud, punctuation, spaces, final-letter forms and a leading ה.
const FINALS = {'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function normHe(s){
  s = (s||'').replace(/[\u0591-\u05C7]/g,'').replace(/[\s"'״׳`.,?!:;()\-–—+]/g,'');
  s = s.replace(/[ךםןףץ]/g, c => FINALS[c]);
  if(s.length>2 && s[0]==='ה') s = s.slice(1);
  return s;
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
// 'exact' | 'close' (one letter off, accepted) | 'wrong'
function matchHe(input, w){
  const n = normHe(input); if(!n) return 'wrong';
  const targets = w.alts.map(normHe);
  if(targets.includes(n)) return 'exact';
  if(targets.some(t => t.length>=4 && lev(n,t)<=1)) return 'close';
  return 'wrong';
}

// SCHEDULING (simplified SM-2: intervals grow with each correct recall)
// ─────────────────────────────────────────────────────────────
const card = id => S.cards[id];
function dueWords(){
  const end = endOfToday();
  return V.filter(w => card(w.id) && card(w.id).due < end).sort((a,b) => card(a.id).due - card(b.id).due);
}
function newAvailable(){
  const left = Math.max(0, S.set.newPerDay - (S.newLog[today()]||0));
  return V.filter(w => !card(w.id) && (S.set.focus==='all' || w.c===S.set.focus)).slice(0, left);
}
function schedule(id, ok, wasMissed){
  const c = S.cards[id] || (S.cards[id] = {ivl:0, ease:2.5, reps:0, lapses:0, due:0});
  if(ok){
    if(wasMissed){ c.ivl = 1; }
    else{
      c.ivl = c.reps===0 ? 1 : c.reps===1 ? 3 : Math.max(c.ivl+1, Math.round(c.ivl*c.ease));
      c.reps++; c.ease = Math.min(3, c.ease+0.05);
    }
    c.due = startOfToday() + c.ivl*DAY;
  } else if(!wasMissed){
    if(c.reps>0) c.lapses++;
    c.ease = Math.max(1.3, c.ease-0.2); c.reps = 0; c.ivl = 0; c.due = 0;
  }
}
function counts(filter){
  let known=0, learning=0, total=0;
  V.forEach(w => {
    if(filter && w.c!==filter) return;
    total++;
    const c = card(w.id); if(!c) return;
    if(c.ivl>=KNOWN_DAYS) known++; else learning++;
  });
  return {known, learning, total};
}
function logDay(ok){
  const d = S.days[today()] || (S.days[today()] = {n:0, ok:0});
  d.n++; if(ok) d.ok++;
}
function streak(){
  const d = new Date();
  if(!S.days[dkey(d)]) d.setDate(d.getDate()-1);
  let n = 0;
  while(S.days[dkey(d)] && S.days[dkey(d)].n>0){ n++; d.setDate(d.getDate()-1); }
  return n;
}

// Distractors: same area first so the choice is a real test, never the same Hebrew word
function distract(w, n=3){
  const okx = x => x.id!==w.id && x.he!==w.he && !w.alts.includes(x.he) && x.en!==w.en;
  const same = shuffle(V.filter(x => okx(x) && x.c===w.c));
  const other = shuffle(V.filter(x => okx(x) && x.c!==w.c));
  const out = [];
  for(const x of [...same, ...other]){
    if(out.length>=n) break;
    if(!out.some(o => o.he===x.he || o.en===x.en)) out.push(x);
  }
  return out;
}
function pickType(w){
  const r = (card(w.id)||{}).reps || 0;
  const listen = heVoice ? 'listen' : 'recall';
  if(r<1) return 'rec';
  if(r<2) return pick(['rec','recall']);
  if(r<4) return pick(['recall','recall',listen]);
  return pick([S.set.typing?'type':'recall', listen, 'recall']);
}

    <div class="sub">${sub}</div>
    <div class="stats">
      <div class="stat"><div class="stat-v">${cnt.known}</div><div class="stat-l">Known</div></div>
      <div class="stat"><div class="stat-v">${cnt.learning}</div><div class="stat-l">Learning</div></div>
      <div class="stat"><div class="stat-v">${streak()}</div><div class="stat-l">Day streak</div></div>
    </div>
    ${due+fresh>0
      ? `<button class="btn btn-p" data-a="start">Start review</button>`
      : `<button class="btn btn-p" data-a="cram" ${learned<4?'disabled':''}>Practise anyway</button>`}
    <button class="btn btn-s" data-a="sent">Practise sentences</button>
    <section class="section"><h2 class="section-t">Progress by area</h2>${rows}</section>
    <div class="foot">${V.length} words and ${SENT.length} sentences. Known means you've recalled it at a gap of three weeks or more.</div>`;
}

// ── Sessions ────────────────────────────────────────────────
function newSess(kind, q, cram){
  return {kind, q, i:0, n:0, ok:0, newN:0, missed:new Set(), tries:{}, cram:!!cram, answered:false, cur:null, timer:null};
}
function startReview(){
  const R = shuffle(dueWords().slice(0, MAX_REVIEWS));
  const N = newAvailable();
  const q = []; let r=0, n=0;
  // Two reviews, then one new word, repeated
  while(r<R.length || n<N.length){
    for(let k=0; k<2 && r<R.length; k++) q.push({w:R[r++], t:'test'});
    if(n<N.length) q.push({w:N[n++], t:'intro'});
  }
  sess = newSess('words', q); view='session'; render();
}
function startCram(){
  const pool = shuffle(V.filter(w => card(w.id))).slice(0,15);
  if(!pool.length) return;
  sess = newSess('words', pool.map(w => ({w, t:'test'})), true); view='session'; render();
}
function startSentences(){
  const end = endOfToday();
  const due = shuffle(SENT.filter(s => S.sent[s.id] && S.sent[s.id].due < end));
  const unseen = SENT.filter(s => !S.sent[s.id]);
  let list = [...due, ...unseen].slice(0, SENT_PER_SESSION);
  if(list.length < SENT_PER_SESSION) list = list.concat(shuffle(SENT.filter(s => !list.includes(s))).slice(0, SENT_PER_SESSION-list.length));
  const q = list.map(s => ({s, t: heVoice && S.sent[s.id] && S.sent[s.id].box>=2 && Math.random()<.5 ? 'hear' : 'build'}));
  sess = newSess('sent', q); view='session'; render();
}

function renderSession(){
  clearTimeout(sess.timer);
  if(sess.i >= sess.q.length){ finish(); return; }
  sess.answered = false;
  const it = sess.q[sess.i];
  const pct = Math.round(sess.i/sess.q.length*100);
  const head = `<div class="sess-top"><button class="link quiet" data-a="end">Close</button><div class="prog"><i style="width:${pct}%"></i></div><div class="count">${sess.i+1} / ${sess.q.length}</div></div>`;
  let body;
  if(sess.kind==='sent') body = sentBody(it);
  else if(it.t==='intro') body = introBody(it.w);
  else body = testBody(it.w);
  app.innerHTML = head + `<div class="stage">${body}</div>`;

  // After render: audio and focus
  const cur = sess.cur, t = cur.type, say = cur.w ? cur.w.he : cur.s.he;
  if(t==='listen' || t==='hear' || (t==='intro' && S.set.autoplay)) setTimeout(() => speak(say), 150);
  if(t==='type'){ const a=$('#ans'); if(a) a.focus({preventScroll:true}); }
  if(sess.kind==='sent') drawTiles();
}

function introBody(w){
  sess.cur = {w, type:'intro'};
  const also = w.alts.length>1 ? `<div class="note">Also <span class="he">${w.alts.slice(1).map(esc).join(', ')}</span></div>` : '';
  return `<div class="ask">New word in ${CATS[w.c]}</div>
    <div class="p-he he">${esc(w.he)}</div>
    <div class="tr">${esc(w.tr)}</div>
    <div class="p-gloss">${esc(w.en)}</div>
    ${also}
    ${w.note ? `<div class="note">${esc(w.note)}</div>` : ''}
    ${playBtn(w.he)}
    <div class="fb"><button class="btn btn-p" data-a="intro">Continue</button></div>`;
}

function testBody(w){
  const type = pickType(w);
  const cur = sess.cur = {w, type};
  const optsHtml = field => `<div class="opts">${cur.opts.map((o,i) =>
    `<button class="opt" data-a="opt" data-i="${i}"><span class="k">${i+1}</span><span class="t${field==='he'?' he':''}">${esc(o[field])}</span></button>`).join('')}</div>`;
  if(type==='rec' || type==='listen' || type==='recall') cur.opts = shuffle([w, ...distract(w)]);

  if(type==='rec') return `<div class="ask">What does this mean?</div>
    <div class="p-he he">${esc(w.he)}</div>
    ${S.set.translit ? `<div class="tr">${esc(w.tr)}</div>` : ''}
    ${playBtn(w.he)}${optsHtml('en')}<div class="fb" id="fb"></div>`;
  if(type==='listen') return `<div class="ask">Listen and choose the meaning</div>
    ${playBtn(w.he, true)}${optsHtml('en')}<div class="fb" id="fb"></div>`;
  if(type==='recall') return `<div class="ask">How do you say it in Hebrew?</div>
    <div class="p-en">${esc(w.en)}</div>${optsHtml('he')}<div class="fb" id="fb"></div>`;
  // type
  return `<div class="ask">Type it in Hebrew</div>
    <div class="p-en">${esc(w.en)}</div>
    <input class="ans he" id="ans" lang="he" dir="rtl" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Your answer in Hebrew">
    ${S.set.kbd ? kbdHtml() : ''}
    <div class="row-btns" id="btns"><button class="btn btn-s" data-a="dunno">Show answer</button><button class="btn btn-p" data-a="check">Check</button></div>
    <div class="fb" id="fb"></div>`;
}

// Standard Israeli keyboard layout, left to right as on the physical keys
const KB = [['ק','ר','א','ט','ו','ן','ם','פ'],['ש','ד','ג','כ','ע','י','ח','ל','ך','ף'],['ז','ס','ב','ה','נ','מ','צ','ת','ץ']];
function kbdHtml(){
  return `<div class="kb">${KB.map(r => `<div class="kb-row">${r.map(k => `<button data-a="key" data-k="${k}" tabindex="-1">${k}</button>`).join('')}</div>`).join('')}
    <div class="kb-row"><button class="wide" data-a="key" data-k="&quot;" tabindex="-1">״</button><button class="wide" data-a="key" data-k=" " tabindex="-1">Space</button><button class="wide" data-a="key" data-k="DEL" tabindex="-1">Delete</button></div></div>`;
}

function pickOpt(i){
  if(sess.answered || !sess.cur.opts) return;
  const c = sess.cur, o = c.opts[i]; if(!o) return;
  const ok = o.id===c.w.id;
  document.querySelectorAll('.opt').forEach((b,j) => {
    b.disabled = true;
    if(c.opts[j].id===c.w.id) b.classList.add('ok');
    else if(j===i) b.classList.add('bad');
    else b.classList.add('dim');
  });
  answerWord(ok, ok ? null : o, false);
}
function checkType(giveUp){
  if(sess.answered) return;
  const inp = $('#ans'); if(!inp) return;
  if(!giveUp && !inp.value.trim()) return;
  const r = giveUp ? 'wrong' : matchHe(inp.value, sess.cur.w);
  inp.disabled = true; inp.classList.add(r==='wrong' ? 'bad' : 'ok');
  const b = $('#btns'); if(b) b.remove();
  const kb = document.querySelector('.kb'); if(kb) kb.remove();
  answerWord(r!=='wrong', null, r==='close');
}

function answerWord(ok, picked, close){
  sess.answered = true; sess.n++; if(ok) sess.ok++;
  const w = sess.cur.w, type = sess.cur.type;
  logDay(ok);
  const wasMissed = sess.missed.has(w.id);
  if(!sess.cram) schedule(w.id, ok, wasMissed);
  if(!ok){
    sess.missed.add(w.id);
    const t = (sess.tries[w.id]||0) + 1; sess.tries[w.id] = t;
    // Bring it back three cards later, up to three times
    if(t<=3) sess.q.splice(Math.min(sess.q.length, sess.i+4), 0, {w, t:'test'});
  }
  save();

  const also = w.alts.length>1 ? `<div class="fb-note">Also <span class="he">${w.alts.slice(1).map(esc).join(', ')}</span></div>` : '';
  $('#fb').innerHTML = `<div class="fb-card">
    <div class="fb-status ${ok?'ok':'bad'}">${ok ? (close ? 'Accepted, but check the spelling' : 'Correct') : 'Not quite'}</div>
    <div class="fb-line"><div><div class="fb-en">${esc(w.en)}</div><div class="fb-tr">${esc(w.tr)}</div></div><div class="fb-he he">${esc(w.he)}</div></div>
    ${also}
    ${w.note ? `<div class="fb-note">${esc(w.note)}</div>` : ''}
    ${picked ? `<div class="fb-note">You chose <span class="he">${esc(picked.he)}</span>, which means ${esc(picked.en.toLowerCase())}</div>` : ''}
    <div class="fb-bottom">${playBtn(w.he)}<button class="btn btn-p" data-a="next">Continue</button></div></div>`;

  if(S.set.autoplay && type!=='listen') speak(w.he);
  // Correct multiple-choice answers move on by themselves
  if(ok && !close && type!=='type') sess.timer = setTimeout(next, 1300);
}

function introDone(){
  const w = sess.cur.w;
  if(!S.cards[w.id]){
    S.cards[w.id] = {ivl:0, ease:2.5, reps:0, lapses:0, due:0};
    S.newLog[today()] = (S.newLog[today()]||0) + 1;
    sess.newN++;
    save();
  }
  sess.q.splice(Math.min(sess.q.length, sess.i+4), 0, {w, t:'test'});
  next();
}
function next(){ clearTimeout(sess.timer); if(window.speechSynthesis) speechSynthesis.cancel(); sess.i++; renderSession(); }

// ── Sentences ───────────────────────────────────────────────
const tokens = he => he.split(/\s+/).map(t => t.replace(/[.,?!:]/g,'')).filter(Boolean);
function sentBody(it){
  const s = it.s, target = tokens(s.he);
  const pool = shuffle([...new Set(SENT.filter(x => x.id!==s.id).flatMap(x => tokens(x.he)))].filter(t => !target.includes(t)));
  sess.cur = {s, type:it.t, target, bank:shuffle([...target, ...pool.slice(0,2)]), placed:[]};
  const prompt = it.t==='hear'
    ? `<div class="ask">Build what you hear</div>${playBtn(s.he, true)}`
    : `<div class="ask">Build this in Hebrew</div><div class="p-en small">${esc(s.en)}</div>`;
  return `${prompt}
    <div class="build he" id="build" aria-label="Your sentence"></div>
    <div class="bank" id="bank"></div>
    <div class="row-btns" id="btns"><button class="btn btn-s" data-a="dunno">Show answer</button><button class="btn btn-p" data-a="check">Check</button></div>
    <div class="fb" id="fb"></div>`;
}
function drawTiles(marks){
  const c = sess.cur, dis = sess.answered ? ' disabled' : '';
  $('#build').innerHTML = c.placed.map((bi,j) =>
    `<button class="tile${marks ? (marks[j] ? ' ok' : ' bad') : ''}" data-a="untile" data-i="${j}"${dis}>${esc(c.bank[bi])}</button>`).join('');
  $('#bank').innerHTML = c.bank.map((t,i) =>
    `<button class="tile${c.placed.includes(i) ? ' used' : ''}" data-a="tile" data-i="${i}"${dis}>${esc(t)}</button>`).join('');
}
function checkSent(giveUp){
  const c = sess.cur;
  if(sess.answered) return;
  if(!giveUp && !c.placed.length) return;
  const built = c.placed.map(i => c.bank[i]);
  const ok = !giveUp && built.join(' ')===c.target.join(' ');
  sess.answered = true; sess.n++; if(ok) sess.ok++;
  logDay(ok);
  drawTiles(built.map((t,k) => t===c.target[k]));
  const b = $('#btns'); if(b) b.remove();

  const id = c.s.id, r = S.sent[id] || {box:0, due:0};
  if(ok){
    if(!sess.missed.has(id)) r.box = Math.min(5, r.box+1);
    r.due = startOfToday() + Math.max(1, SENT_INTERVALS[r.box])*DAY;
  } else {
    r.box = Math.max(0, r.box-1); r.due = 0;
    if(!sess.missed.has(id)){ sess.missed.add(id); sess.q.push({s:c.s, t:'build'}); }
  }
  S.sent[id] = r; save();

  $('#fb').innerHTML = `<div class="fb-card">
    <div class="fb-status ${ok?'ok':'bad'}">${ok ? 'Correct' : giveUp ? 'Answer' : 'Not quite'}</div>
    <div class="fb-sent he">${esc(c.s.he)}</div>
    <div class="fb-tr">${esc(c.s.tr)}</div>
    <div class="fb-note">${esc(c.s.en)}</div>
    <div class="fb-bottom">${playBtn(c.s.he)}<button class="btn btn-p" data-a="next">Continue</button></div></div>`;
  if(S.set.autoplay && c.type!=='hear') speak(c.s.he);
}

function finish(){
  clearTimeout(sess.timer);
  view = 'summary';
  const acc = sess.n ? Math.round(sess.ok/sess.n*100) : 0;
  const tEnd = endOfToday();
  const tomorrow = Object.values(S.cards).filter(c => c.due>=tEnd && c.due<tEnd+DAY).length;
  const third = sess.kind==='sent'
    ? `<div class="stat"><div class="stat-v">${sess.ok}</div><div class="stat-l">Built correctly</div></div>`
    : `<div class="stat"><div class="stat-v">${sess.newN}</div><div class="stat-l">New words</div></div>`;
  app.innerHTML = `<header class="top"><div class="brand">FP&amp;A Hebrew</div></header>
    <div class="date">Session complete</div>
    <h1 class="headline">${acc}% correct</h1>
    <div class="sub">${tomorrow ? `${tomorrow} ${tomorrow===1?'word':'words'} due tomorrow` : 'Nothing scheduled for tomorrow yet'}</div>
    <div class="stats">
      <div class="stat"><div class="stat-v">${sess.n}</div><div class="stat-l">Answered</div></div>
      ${third}
      <div class="stat"><div class="stat-v">${streak()}</div><div class="stat-l">Day streak</div></div>
    </div>
    <button class="btn btn-p" data-a="home">Done</button>`;
  sess = null;
}

// ── Words ───────────────────────────────────────────────────
function renderWords(){
  app.innerHTML = `${subBar('Words')}
    <input class="field" id="q" type="search" placeholder="Search English, Hebrew or transliteration" autocomplete="off">
    <select class="field" id="wcat"><option value="all">All areas</option>${Object.keys(CATS).map(k => `<option value="${k}">${CATS[k]}</option>`).join('')}</select>
    <div class="legend"><span><i class="dot"></i>New</span><span><i class="dot l"></i>Learning</span><span><i class="dot k"></i>Known</span></div>
    <div class="meta" id="wmeta"></div><div id="wlist"></div>`;
  $('#q').addEventListener('input', drawWords);
  $('#wcat').addEventListener('change', drawWords);
  drawWords();
}
function drawWords(){
  const q = ($('#q').value||'').trim().toLowerCase(), cat = $('#wcat').value, nq = normHe(q);
  const list = V.filter(w => (cat==='all' || w.c===cat) && (!q ||
    w.en.toLowerCase().includes(q) || w.tr.toLowerCase().includes(q) || (nq && w.alts.some(a => normHe(a).includes(nq)))));
  $('#wmeta').textContent = `${list.length} ${list.length===1?'word':'words'}${heVoice ? '. Tap a word to hear it.' : ''}`;
  $('#wlist').innerHTML = list.map(w => {
    const c = card(w.id), st = !c ? '' : c.ivl>=KNOWN_DAYS ? ' k' : ' l';
    return `<button class="w" data-a="say" data-t="${esc(w.he)}"><i class="dot${st}"></i><div><div class="w-en">${esc(w.en)}</div><div class="w-tr">${esc(w.tr)}</div></div><div class="w-he he">${esc(w.he)}</div></button>`;
  }).join('');
}

// ── Settings ────────────────────────────────────────────────
function renderSettings(){
  const seg = (k, opts) => `<div class="seg">${opts.map(([v,l]) => `<button class="${S.set[k]===v?'on':''}" data-a="seg" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
  const sw = k => `<label class="sw"><input type="checkbox" data-set="${k}" ${S.set[k]?'checked':''}><span></span></label>`;
  app.innerHTML = `${subBar('Settings')}
    <div class="set"><div>New words per day</div>${seg('newPerDay', [[0,'0'],[5,'5'],[10,'10'],[15,'15'],[20,'20']])}</div>
    <div class="set"><div>New words from</div><select data-set="focus"><option value="all">All areas</option>${Object.keys(CATS).map(k => `<option value="${k}" ${S.set.focus===k?'selected':''}>${CATS[k]}</option>`).join('')}</select></div>
    <div class="set"><div><div>Typed answers</div><div class="set-d">For words you already know well</div></div>${sw('typing')}</div>
    <div class="set"><div><div>On-screen Hebrew keyboard</div><div class="set-d">For computers without a Hebrew layout</div></div>${sw('kbd')}</div>
    <div class="set"><div><div>Transliteration in questions</div><div class="set-d">Off makes you read the Hebrew</div></div>${sw('translit')}</div>
    <div class="set"><div>Play audio automatically</div>${sw('autoplay')}</div>
    <div class="set"><div>Speech speed</div>${seg('rate', [[0.7,'Slow'],[0.9,'Normal'],[1,'Fast']])}</div>
    <div class="set"><div>Hebrew voice</div><div class="set-d">${heVoice ? esc(heVoice.name) : 'None on this device'}</div></div>
    <section class="section"><h2 class="section-t">Progress</h2>
      <div class="set"><div><div>Export progress</div><div class="set-d">Saved in this browser only</div></div><button class="link" data-a="export">Export</button></div>
      <div class="set"><div>Import progress</div><button class="link" data-a="import">Import</button></div>
      <div class="set"><div>Reset all progress</div><button class="link danger" data-a="reset">Reset</button></div>
    </section>`;
}

// ─────────────────────────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────────────────────────
function replay(){
  if(!sess || !sess.cur) return;
  speak(sess.cur.w ? sess.cur.w.he : sess.cur.s.he);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b || b.disabled) return;
  const a = b.dataset.a;
  if(a!=='key') b.blur();
  switch(a){
    case 'home': view='home'; render(); break;
    case 'words': view='words'; render(); break;
    case 'settings': view='settings'; render(); break;
    case 'start': startReview(); break;
    case 'cram': startCram(); break;
    case 'sent': startSentences(); break;
    case 'say': speak(b.dataset.t); break;
    case 'intro': introDone(); break;
    case 'opt': pickOpt(+b.dataset.i); break;
    case 'check': sess.kind==='sent' ? checkSent(false) : checkType(false); break;
    case 'dunno': sess.kind==='sent' ? checkSent(true) : checkType(true); break;
    case 'next': if(sess && sess.answered) next(); break;
    case 'end': clearTimeout(sess.timer); if(sess.n) finish(); else { sess=null; view='home'; render(); } break;
    case 'key': {
      const inp = $('#ans'); if(!inp || inp.disabled) break;
      const k = b.dataset.k;
      inp.value = k==='DEL' ? inp.value.slice(0,-1) : inp.value + k;
      if(window.matchMedia('(pointer: fine)').matches) inp.focus({preventScroll:true});
      break;
    }
    case 'tile': { const c=sess.cur, i=+b.dataset.i; if(!sess.answered && !c.placed.includes(i)){ c.placed.push(i); drawTiles(); } break; }
    case 'untile': { if(!sess.answered){ sess.cur.placed.splice(+b.dataset.i,1); drawTiles(); } break; }
    case 'seg': { const k=b.dataset.k; S.set[k]=Number(b.dataset.v); save(); renderSettings(); break; }
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
      const u = URL.createObjectURL(blob), l = document.createElement('a');
      l.href = u; l.download = `fpa-hebrew-progress-${today()}.json`; document.body.appendChild(l); l.click(); l.remove();
      setTimeout(() => URL.revokeObjectURL(u), 1000);
      break;
    }
    case 'import': $('#imp').click(); break;
    case 'reset':
      if(confirm('Reset all progress? This cannot be undone.')){ S = {cards:{}, sent:{}, days:{}, newLog:{}, set:S.set}; save(); view='home'; render(); }
      break;
  }
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.set; if(!k) return;
  S.set[k] = e.target.type==='checkbox' ? e.target.checked : e.target.value; save();
});
$('#imp').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const x = JSON.parse(r.result);
      if(!x || typeof x.cards!=='object') throw new Error('No progress found in this file.');
      if(!confirm('Replace progress in this browser with the imported file?')) return;
      S = {cards:x.cards, sent:x.sent||{}, days:x.days||{}, newLog:x.newLog||{}, set:{...DEFAULTS, ...(x.set||{})}};
      save(); view='home'; render();
    }catch(err){ alert('Import failed: ' + err.message); }
    e.target.value = '';
  };
  r.readAsText(f);
});
document.addEventListener('keydown', e => {
  if(view!=='session' || !sess) return;
  const inInput = e.target.tagName==='INPUT';
  const it = sess.q[sess.i]; if(!it) return;
  if(e.key==='Escape'){ e.preventDefault(); $('[data-a="end"]').click(); return; }
  if(sess.answered){ if(e.key==='Enter' || (!inInput && e.key===' ')){ e.preventDefault(); next(); } return; }
  if(sess.kind==='words' && it.t==='intro'){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); introDone(); } return; }
  if(e.key==='Enter'){ if(sess.kind==='sent' || sess.cur.type==='type'){ e.preventDefault(); sess.kind==='sent' ? checkSent(false) : checkType(false); } return; }
  if(!inInput && /^[1-4]$/.test(e.key) && sess.cur.opts){ pickOpt(+e.key-1); return; }
  if(!inInput && (e.key===' ' || e.key.toLowerCase()==='r')){ e.preventDefault(); replay(); }
});

render();
})();
</script>
</body>
</html>
